<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posts — CRUD Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="nav-logo">⚡ CRUD Manager</div>
            <div class="nav-links">
                <a href="../Principal.html">Inicio</a>
                <a href="Products.html">Productos</a>
                <a href="Users.html">Usuarios</a>
                <a href="Posts.html">Posts</a>
                <a href="Carts.html">Carrito</a>
            </div>
        </nav>
    </header>

    <div class="contenedor">

        <div class="page-header">
            <h1>📝 Gestión de Posts</h1>
            <p class="page-subtitle">Crea y administra publicaciones</p>
        </div>

        <div class="forms-grid">

            <div class="card-form">
                <div class="card-form-header">
                    <span class="card-form-icon">➕</span>
                    <h2>Crear Post</h2>
                </div>
                <label>User ID</label>
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="number" id="postUserId" class="form-control" placeholder="ID del usuario" />
                    <button class="btn btn-success" onclick="verificarUsuarioPost()">Verificar</button>
                </div>
                <div id="postUserInfo" style="display:none; margin-bottom:15px;" class="user-info-box">
                    <span id="postUserInfoText"></span>
                </div>
                <label>Título</label>
                <input type="text" id="inputTitlePost" class="form-control mb-3" placeholder="Título del post" />
                <label>Contenido</label>
                <textarea id="inputBodyPost" class="form-control mb-3" placeholder="Escribe el contenido..." rows="4"></textarea>
                <button class="btn btn-success w-100" onclick="crearPost()">Publicar Post</button>
            </div>

            <div class="card-form">
                <div class="card-form-header">
                    <span class="card-form-icon">✏️</span>
                    <h2>Actualizar Post</h2>
                </div>
                <label>ID del post</label>
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="text" id="update_id_posts" class="form-control" placeholder="ID" />
                    <button class="btn btn-success" onclick="consultarUpdatePosts()">Buscar</button>
                </div>
                <label>Título</label>
                <input type="text" id="update_title" class="form-control mb-3" placeholder="Título" />
                <label>Contenido</label>
                <textarea id="update_body" class="form-control mb-3" placeholder="Contenido" rows="4"></textarea>
                <label>User ID</label>
                <input type="number" id="update_userId" class="form-control mb-3" placeholder="User ID" />
                <button class="btn btn-success w-100" onclick="actualizarPost()">Actualizar Post</button>
            </div>

        </div>

        <div class="actions-grid">
            <div class="consulta-box">
                <span class="consulta-icon">🔍</span>
                <label>Buscar por ID</label>
                <input type="text" class="form-control" placeholder="ID del post" id="idConsultPosts" />
                <button class="btn btn-success" onclick="obtenerPosts()">Buscar</button>
                <button class="btn btn-outline" onclick="document.getElementById('idConsultPosts').value=''; obtenerPosts()">Ver todos</button>
            </div>
            <div class="consulta-box danger-box">
                <span class="consulta-icon">🗑️</span>
                <label>Eliminar post</label>
                <input type="text" id="inputBorrarPost" class="form-control" placeholder="ID del post" />
                <button class="btn btn-danger" onclick="borrarPost(document.getElementById('inputBorrarPost').value)">Eliminar</button>
            </div>
        </div>

        <p id="resultado"></p>

        <div class="table-section">
            <h2 class="table-title">📋 Lista de Posts</h2>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Contenido</th>
                            <th>User ID</th>
                            <th>Editar</th>
                            <th>Eliminar</th>
                        </tr>
                    </thead>
                    <tbody id="container"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/Crud.js"></script>
    <script src="../../js/Posts.js"></script>
    <script>
        obtenerPosts();
        document.querySelectorAll("nav a").forEach(function(link) {
            if (link.href === window.location.href) link.classList.add("active");
        });
    </script>
</body>
</html>
