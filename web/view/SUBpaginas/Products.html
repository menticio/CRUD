<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Productos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
     <header>
        <nav>
            <a href="../Principal.html">Inicio</a>
            <a href="SUBpaginas/Products.html">Productos</a>
            <a href="SUBpaginas/Users.html">Usuarios</a>
            <a href="SUBpaginas/Posts.html">Envios</a>
            <a href="SUBpaginas/Carts.html">Carrito</a>
        </nav>
    </header>
    <div class="contenedor">

        <div class="consulta-box">

            <label>Id</label>

            <input type="text" class="form-control" placeholder="Ingresa el número identificador" id="idConsult" />

             <button class="btn btn-success" onclick=" obtenerProductos()">
                Consultar Producto
            </button>

        </div>

        <div class="card-form">

            <h2>Agregar Producto</h2>
            
            <label>Titulo</label>
            <input type="text" id="inputTitulo" class="form-control mb-3" placeholder="Título" />

            <label>Precio</label>
            <input type="number" id="inputPrecio" class="form-control mb-3" placeholder="Precio" />

            <label>Categoria</label>
            <input type="text" id="inputCategoria" class="form-control mb-3" placeholder="Categoría" />

            <button class="btn btn-success w-100" onclick="crearProducto()">
                Agregar Producto
            </button>

        </div>

        <div class="consulta-box">

            <label>ID del producto que deseas borrar</label>

            <input type="text" id="inputBorrar" class="form-control" placeholder="Id" />

            <button class="btn btn-danger" onclick="borrarProductos(document.getElementById('inputBorrar').value)">
                Borrar
            </button>

        </div>

        <div class="consulta-box">

            <p> <strong>producto que deseas Actualizar</strong></p>

              <label>Id</label>

            <input type="text" class="form-control" placeholder="Ingresa el número identificador" id="idConsultUpdate" />

             <button class="btn btn-success" onclick=" consultarProductoActulizable()">
                Consultar Producto
            </button><br>
            
            <label>Titulo</label>
            <input type="text" id="inputTituloUPDATE" class="form-control mb-3" placeholder="Título" />

            <label>Precio</label>
            <input type="number" id="inputPrecioUPDATE" class="form-control mb-3" placeholder="Precio" />

            <label>Categoria</label>
            <input type="text" id="inputCategoriaUPDATE" class="form-control mb-3" placeholder="Categoría" />
            
            <button class="btn btn-danger" onclick="actualizarProducto()">
                Actuzalizar
            </button>

        </div>

        <p id="resultado"></p>


        <!-- TABLA -->
         
        <h1>Tabla de Productos</h1>
        <div class="table-responsive">

            <table class="table">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Price</th>
                        <th>Category</th>
                        <th></th>
                        <th></th>
                    </tr>

                </thead>

                <tbody id="container"></tbody>

            </table>

        </div>

    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/Products.js"></script>

    <script>
        obtenerProductos();
    </script> 
</body>
</html>
