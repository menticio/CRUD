<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products — CRUD Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="nav-logo">⚡ CRUD Manager</div>
            <div class="nav-links">
                <a href="../Principal.html">Inicio</a>
                <a href="Products.html">Productos</a>
                <a href="Users.html">Usuarios</a>
                <a href="Posts.html">Posts</a>
                <a href="Carts.html">Carrito</a>
            </div>
        </nav>
    </header>

    <div class="contenedor">

        <div class="page-header">
            <h1>📦 Gestión de Productos</h1>
            <p class="page-subtitle">Administra el catálogo completo de productos</p>
        </div>

        <!-- FORMULARIOS GRID -->
        <div class="forms-grid">

            <!-- CREAR -->
            <div class="card-form">
                <div class="card-form-header">
                    <span class="card-form-icon">➕</span>
                    <h2>Agregar Producto</h2>
                </div>
                <label>Título</label>
                <input type="text" id="inputTitulo" class="form-control mb-3" placeholder="Título del producto" />
                <label>Precio</label>
                <input type="number" id="inputPrecio" class="form-control mb-3" placeholder="Precio" />
                <label>Categoría</label>
                <input type="text" id="inputCategoria" class="form-control mb-3" placeholder="Categoría" />
                <button class="btn btn-success w-100" onclick="crearProducto()">Agregar Producto</button>
            </div>

            <!-- ACTUALIZAR -->
            <div class="card-form">
                <div class="card-form-header">
                    <span class="card-form-icon">✏️</span>
                    <h2>Actualizar Producto</h2>
                </div>
                <label>ID del producto</label>
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="text" id="update_id" class="form-control" placeholder="ID" />
                    <button class="btn btn-success" onclick="consultarUpdate()">Buscar</button>
                </div>
                <label>Título</label>
                <input type="text" id="update_title" class="form-control mb-3" placeholder="Título" />
                <label>Precio</label>
                <input type="number" id="update_price" class="form-control mb-3" placeholder="Precio" />
                <label>Categoría</label>
                <input type="text" id="update_category" class="form-control mb-3" placeholder="Categoría" />
                <button class="btn btn-success w-100" onclick="actualizarProducto()">Actualizar Producto</button>
            </div>

        </div>

        <!-- BUSCADOR Y BORRAR -->
        <div class="actions-grid">

            <div class="consulta-box">
                <span class="consulta-icon">🔍</span>
                <label>Buscar por ID</label>
                <input type="text" class="form-control" placeholder="ID del producto" id="idConsult" />
                <button class="btn btn-success" onclick="obtenerProductos()">Buscar</button>
                <button class="btn btn-outline" onclick="document.getElementById('idConsult').value=''; obtenerProductos()">Ver todos</button>
            </div>

            <div class="consulta-box danger-box">
                <span class="consulta-icon">🗑️</span>
                <label>Eliminar producto</label>
                <input type="text" id="inputBorrar" class="form-control" placeholder="ID del producto" />
                <button class="btn btn-danger" onclick="borrarProducto(document.getElementById('inputBorrar').value)">Eliminar</button>
            </div>

        </div>

        <p id="resultado"></p>

        <!-- TABLA -->
        <div class="table-section">
            <h2 class="table-title">📋 Lista de Productos</h2>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Precio</th>
                            <th>Categoría</th>
                            <th>Editar</th>
                            <th>Eliminar</th>
                        </tr>
                    </thead>
                    <tbody id="container"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/Crud.js"></script>
    <script src="../../js/Products.js"></script>
    <script>
        obtenerProductos();
        document.querySelectorAll("nav a").forEach(function(link) {
            if (link.href === window.location.href) link.classList.add("active");
        });
    </script>
</body>
</html>
